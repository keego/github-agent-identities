name: Deploy private MCP staging (manual)

on:
  workflow_dispatch:
    inputs:
      takeover_api_bootstrap:
        description: 'One-time only: explicitly replace the existing API-created 503-only staging bootstrap'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-agent-identities-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy access-protected staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual workflows on feature branches must not receive deployment credentials.
    if: github.ref == 'refs/heads/main'
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      ACCESS_ISSUER: ${{ vars.ACCESS_ISSUER }}
      ACCESS_AUDIENCE: ${{ vars.ACCESS_AUDIENCE }}
      ALLOWED_ACCESS_EMAILS: ${{ secrets.ALLOWED_ACCESS_EMAILS }}
      MCP_PUBLIC_HOSTNAME: ${{ vars.MCP_PUBLIC_HOSTNAME }}
      # This is a sign-in and identity-binding test. No GitHub operations.
      GH_APP_READONLY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check operator-only configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_D1_DATABASE_ID ACCESS_ISSUER ACCESS_AUDIENCE ALLOWED_ACCESS_EMAILS MCP_PUBLIC_HOSTNAME)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Staging environment variable or secret $key is missing"
              exit 1
            fi
          done
          case "$MCP_PUBLIC_HOSTNAME" in
            github-agent-identities-staging.*.workers.dev) ;;
            *) echo "::error::MCP_PUBLIC_HOSTNAME is not the staging workers.dev hostname"; exit 1 ;;
          esac
          if [ "$GH_APP_READONLY_ENABLED" != 'false' ]; then
            echo '::error::GitHub reads must remain disabled in the login pilot'
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete QA before deploying
        run: npm run qa:local
      - name: Deploy staging Worker (normal, no provision)
        if: ${{ !inputs.takeover_api_bootstrap }}
        run: npx cf deploy --mode staging --no-provision --message 'Private staging OAuth verification'
      - name: One-time takeover of API-created staging bootstrap
        if: ${{ inputs.takeover_api_bootstrap }}
        # --force ONLY bypasses API-created Worker conflict after explicit approval.
        # --no-provision still prohibits silently creating new D1 resources.
        run: npx cf deploy --mode staging --no-provision --force --message 'Approved one-time API bootstrap takeover'
