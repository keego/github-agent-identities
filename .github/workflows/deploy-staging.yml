name: Deploy private MCP staging (manual)

on:
  workflow_dispatch:
    inputs:
      takeover_api_bootstrap:
        description: 'One-time only: explicitly replace the existing API-created 503-only staging bootstrap'
        required: true
        type: boolean
        default: false
      enable_github_app_reads:
        description: 'Explicit opt-in to the read-only GitHub App PR pilot; requires a staging Worker App secret'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-agent-identities-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy access-protected staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual workflows on feature branches must not receive deployment credentials.
    if: github.ref == 'refs/heads/main'
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      ACCESS_ISSUER: ${{ vars.ACCESS_ISSUER }}
      ACCESS_AUDIENCE: ${{ vars.ACCESS_AUDIENCE }}
      ALLOWED_ACCESS_EMAILS: ${{ secrets.ALLOWED_ACCESS_EMAILS }}
      MCP_PUBLIC_HOSTNAME: ${{ vars.MCP_PUBLIC_HOSTNAME }}
      # Default stays disabled. A manually requested pilot can expose ONLY read-only PR tools.
      GH_APP_READONLY_ENABLED: ${{ inputs.enable_github_app_reads && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check operator-only configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_D1_DATABASE_ID ACCESS_ISSUER ACCESS_AUDIENCE ALLOWED_ACCESS_EMAILS MCP_PUBLIC_HOSTNAME)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Staging environment variable or secret $key is missing"
              exit 1
            fi
          done
          case "$MCP_PUBLIC_HOSTNAME" in
            github-agent-identities-staging.*.workers.dev) ;;
            *) echo "::error::MCP_PUBLIC_HOSTNAME is not the staging workers.dev hostname"; exit 1 ;;
          esac
          if [ "$GH_APP_READONLY_ENABLED" = 'true' ]; then
            # Check the pre-existing Worker secret *name*, never read or print its value.
            # Do not put App PEMs in GitHub Actions secrets or workflow variables.
            if ! curl --fail --silent --show-error --max-time 25 \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/github-agent-identities-staging/secrets" \
              | jq -e '(.success == true) and ((.result // []) | any(.name == "GH_APP_DESIGN_PRIVATE_KEY"))' >/dev/null; then
              echo '::error::Read-only pilot requires an existing GH_APP_DESIGN_PRIVATE_KEY staging Worker secret binding'
              exit 1
            fi
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete QA before deploying
        run: npm run qa:local
      - name: Deploy staging Worker (normal, no provision)
        if: ${{ !inputs.takeover_api_bootstrap }}
        run: npx cf deploy --mode staging --no-provision --message 'Private staging OAuth verification'
      - name: One-time takeover of API-created staging bootstrap
        if: ${{ inputs.takeover_api_bootstrap }}
        # --force ONLY bypasses API-created Worker conflict after explicit approval.
        # --no-provision still prohibits silently creating new D1 resources.
        run: npx cf deploy --mode staging --no-provision --force --message 'Approved one-time API bootstrap takeover'
      - name: Confirm anonymous requests are blocked by Cloudflare Access
        # This is an edge-level check from a fresh CI runner: no cookie/token.
        # Fail if /health returns a public 2xx, and fail on network errors.
        shell: bash
        run: |
          set -euo pipefail
          url="https://${MCP_PUBLIC_HOSTNAME}/health"
          code="$(curl --silent --show-error --max-time 25 --connect-timeout 10 --output /dev/null --write-out '%{http_code}' "$url")"
          case "$code" in
            302|303|307|308|401|403) ;; # Access denied or redirected to sign-in
            2??) echo '::error::Anonymous /health is accessible; Access must protect the entire Worker'; exit 1 ;;
            *) echo "::error::Unexpected anonymous /health response (HTTP $code); Access denial not established"; exit 1 ;;
          esac
          echo "Anonymous staging health request denied by Access (HTTP $code)"
